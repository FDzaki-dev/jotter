name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Determine version identifiers
        id: ver
        run: |
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=build-$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          {
            echo "commit_msg<<EOF"
            git log -1 --pretty=%s
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Write key.properties
        run: |
          cat > key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../release.keystore
          PROPS

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build_output.log

      - name: Rename APK outputs
        run: |
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            ABI=$(echo "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "Jotter-v${{ steps.ver.outputs.app_version }}-build${{ github.run_number }}-${ABI}.apk"
          done
          ls -la

      - name: Build summary
        run: |
          {
            echo "## 📦 Jotter ${{ steps.ver.outputs.app_version }} — build #${{ github.run_number }}"
            echo ""
            echo "**Commit:** \`${{ steps.ver.outputs.short_sha }}\` — ${{ steps.ver.outputs.commit_msg }}"
            echo ""
            echo "| APK | Ukuran |"
            echo "|---|---|"
            for f in app/build/outputs/apk/release/Jotter-v*.apk; do
              [ -e "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs_fail_${{ steps.ver.outputs.app_version }}_${{ github.run_number }}_${{ steps.ver.outputs.short_sha }}
          path: |
            build_output.log
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stale run guard
        run: |
          REMOTE_SHA=$(git ls-remote origin main | awk '{print $1}')
          echo "Remote main SHA: $REMOTE_SHA"
          echo "This run SHA:   ${{ github.sha }}"
          if [ "$REMOTE_SHA" != "${{ github.sha }}" ]; then
            echo "Stale run detected - a newer commit exists on main. Aborting before release."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Jotter ${{ steps.ver.outputs.app_version }} · build #${{ github.run_number }}"
          body: |
            **Commit:** `${{ steps.ver.outputs.short_sha }}` — ${{ steps.ver.outputs.commit_msg }}
            **Build:** #${{ github.run_number }} (`${{ steps.ver.outputs.tag }}`)

            ### APK per arsitektur
            Gak yakin device pakai apa? Coba `arm64-v8a` dulu (mayoritas HP 64-bit modern).
            - `Jotter-v${{ steps.ver.outputs.app_version }}-build${{ github.run_number }}-arm64-v8a.apk`
            - `Jotter-v${{ steps.ver.outputs.app_version }}-build${{ github.run_number }}-armeabi-v7a.apk`
            - `Jotter-v${{ steps.ver.outputs.app_version }}-build${{ github.run_number }}-x86_64.apk` (emulator / device x86)
          generate_release_notes: true
          files: app/build/outputs/apk/release/Jotter-v*.apk
          make_latest: true
