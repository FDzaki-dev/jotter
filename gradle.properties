org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.nonTransitiveRClass=true

# Versioning Lock: base semver "epoch" label (native rewrite generation), BUKAN build identifier.
# versionCode & versionName aktual di-assemble otomatis di app/build.gradle.kts dari properti ini
# + appVersionCode/appVersionName yang di-inject CI (.github/workflows/release.yml) via -P flag.
# Ganti nilai ini HANYA untuk milestone besar (mis. 2.0.0 -> 3.0.0), BUKAN per-rilis.
jotterBaseVersion=2.0.0
