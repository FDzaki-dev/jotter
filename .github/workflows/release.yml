name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          mkdir -p android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../release.keystore
          PROPS

      - name: Build release APK
        run: flutter build apk --release

      - name: Stale run guard
        run: |
          REMOTE_SHA=$(git ls-remote origin main | awk '{print $1}')
          echo "Remote main SHA: $REMOTE_SHA"
          echo "This run SHA:   ${{ github.sha }}"
          if [ "$REMOTE_SHA" != "${{ github.sha }}" ]; then
            echo "Stale run detected - a newer commit exists on main. Aborting before release."
            exit 1
          fi

      - name: Determine version tag
        id: ver
        run: echo "tag=build-$(date +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Jotter ${{ steps.ver.outputs.tag }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
